<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cyber Nyx · 夜之女神赛博助手</title>
<style>
  :root {
    --bg0: #0b1026; --bg1: #151a3a; --gold: #c9a35c; --violet: #7c6ff0;
    --text: #eef1ff; --dim: #9aa3d0; --card: rgba(255,255,255,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background: radial-gradient(1200px 700px at 80% -10%, #2a2160 0%, var(--bg0) 55%), var(--bg0);
    color: var(--text); height:100vh; overflow:hidden;
  }
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.7; animation: twinkle 3s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.9} }

  .app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; max-width:880px; margin:0 auto; padding:18px 20px 0; }

  header { display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.08); }
  .moon { width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff4d6, var(--gold)); box-shadow:0 0 24px rgba(201,163,92,.7); }
  .brand h1 { font-size:20px; font-weight:600; letter-spacing:1px; }
  .brand p { font-size:12px; color:var(--dim); margin-top:2px; }
  .status { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#5cd47c; box-shadow:0 0 8px #5cd47c; }

  .avatar-zone { display:flex; justify-content:center; padding:34px 0 18px; }
  .avatar {
    width:150px; height:150px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3d3278, #171b3e);
    border:2px solid rgba(201,163,92,.55);
    box-shadow: 0 0 60px rgba(124,111,240,.35), inset 0 0 40px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    font-size:64px; transition: transform .3s ease;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-8px) } }
  .avatar.happy { transform: scale(1.05) rotate(2deg); }
  .avatar.sad { filter: saturate(.6) brightness(.85); }
  .avatar.curious { transform: rotate(-4deg) scale(1.03); }
  .avatar.angry { transform: scale(.98) rotate(-3deg); filter: hue-rotate(-20deg) saturate(1.3); }
  .avatar.surprised { transform: scale(1.1); animation: none; }
  .avatar.shy { transform: translateY(4px) scale(.98); filter: brightness(1.08); }

  .chat { flex:1; overflow-y:auto; padding:6px 4px 12px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:76%; padding:11px 15px; border-radius:16px; font-size:15px; line-height:1.55; animation: rise .25s ease; }
  @keyframes rise { from{ opacity:0; transform: translateY(6px) } to{ opacity:1; transform:none } }
  .nyx { align-self:flex-start; background:var(--card); border:1px solid rgba(201,163,92,.22); border-bottom-left-radius:4px; }
  .me { align-self:flex-end; background:linear-gradient(135deg,#2a2f66,#3b3277); border:1px solid rgba(124,111,240,.35); border-bottom-right-radius:4px; }
  .typing { color:var(--dim); font-size:14px; align-self:flex-start; padding:6px 4px; }
  .typing-cursor {
    display:inline-block; width:2px; height:1em; background:var(--gold);
    margin-left:2px; vertical-align:-2px; animation: blink .8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .new-chat {
    background:transparent; border:1px solid rgba(255,255,255,.14); color:var(--dim);
    border-radius:10px; padding:7px 12px; font-size:12px; cursor:pointer; transition: all .2s;
  }
  .new-chat:hover { color:var(--text); border-color:var(--gold); background:rgba(201,163,92,.1); }

  .mem-btn {
    background:transparent; border:1px solid rgba(255,255,255,.14); color:var(--dim);
    border-radius:10px; padding:7px 12px; font-size:12px; cursor:pointer; transition: all .2s;
  }
  .mem-btn:hover { color:var(--text); border-color:var(--violet); background:rgba(124,111,240,.12); }
  .mode-switch { display:flex; align-items:center; gap:4px; padding:3px; border:1px solid rgba(255,255,255,.12); border-radius:20px; background:rgba(255,255,255,.04); }
  .mode-switch button { border:none; background:transparent; color:var(--dim); font-size:12px; padding:4px 10px; border-radius:16px; cursor:pointer; transition:all .2s; }
  .mode-switch button:hover { color:var(--text); }
  .mode-switch button.active { background:var(--violet); color:#fff; box-shadow:0 2px 10px rgba(124,111,240,.4); }

  .memory-panel {
    position:fixed; top:0; right:-360px; width:340px; height:100vh; z-index:30;
    background:linear-gradient(180deg, #171b3e, #10142e);
    border-left:1px solid rgba(201,163,92,.25);
    box-shadow:-8px 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    transition: right .3s ease; padding:18px 16px;
  }
  .memory-panel.open { right:0; }
  .memory-panel-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .memory-panel-head span { font-size:15px; font-weight:600; color:var(--text); }
  .memory-close {
    background:transparent; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:4px 8px;
  }
  .memory-close:hover { color:var(--text); }
  .memory-list { flex:1; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .mem-item {
    background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:9px 11px; display:flex; align-items:flex-start; gap:8px;
  }
  .mem-item:hover { border-color:rgba(201,163,92,.3); }
  .mem-info { flex:1; min-width:0; }
  .mem-content { font-size:13px; color:var(--text); line-height:1.45; word-break:break-all; }
  .mem-meta { font-size:11px; color:var(--dim); margin-top:4px; }
  .mem-del {
    flex-shrink:0; background:transparent; border:1px solid rgba(255,255,255,.12);
    color:var(--dim); border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer; transition:all .2s;
  }
  .mem-del:hover { color:#ff9a9a; border-color:rgba(255,120,120,.5); }
  .mem-empty { color:var(--dim); font-size:13px; text-align:center; padding:30px 10px; }
  .memory-foot { text-align:center; color:var(--dim); font-size:11px; padding-top:10px; }

  .settings-panel {
    position:fixed; top:0; right:-380px; width:360px; height:100vh; z-index:40;
    background:linear-gradient(180deg, #171b3e, #10142e);
    border-left:1px solid rgba(124,111,240,.35);
    box-shadow:-8px 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    transition: right .3s ease; padding:18px 16px;
  }
  .settings-panel.open { right:0; }
  .settings-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .settings-head span { font-size:15px; font-weight:600; color:var(--text); }
  .settings-close { background:transparent; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:4px 8px; }
  .settings-close:hover { color:var(--text); }
  .settings-body { flex:1; overflow-y:auto; margin-top:12px; }
  .settings-sec { margin-bottom:18px; }
  .settings-sec h3 { font-size:13px; color:var(--gold); margin-bottom:10px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .settings-field { margin-bottom:10px; }
  .settings-field label { display:block; font-size:12px; color:var(--dim); margin-bottom:5px; }
  .settings-field input {
    width:100%; background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:13px; outline:none; box-sizing:border-box; transition:border .2s;
  }
  .settings-field input:focus { border-color: var(--violet); }
  .settings-status { font-size:12px; color:var(--dim); margin:8px 0 4px; line-height:1.6; }
  .settings-status .ok { color:#8ef0b0; }
  .settings-status .bad { color:#ff9a9a; }
  .settings-save {
    width:100%; background:linear-gradient(135deg, var(--violet), #5a4bd8); border:none; border-radius:12px;
    color:#fff; font-weight:700; padding:12px; font-size:14px; cursor:pointer; transition:opacity .2s;
  }
  .settings-save:hover { opacity:.85; }
  .settings-msg { text-align:center; font-size:12px; margin-top:10px; min-height:18px; color:var(--dim); }
  .settings-msg.ok { color:#8ef0b0; }
  .settings-msg.err { color:#ff9a9a; }


  .input-bar { display:flex; gap:10px; padding:14px 0 20px; }
  .input-bar input {
    flex:1; background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:12px;
    padding:13px 16px; color:var(--text); font-size:15px; outline:none; transition:border .2s;
  }
  .input-bar input:focus { border-color: var(--gold); }
  .input-bar button {
    background: linear-gradient(135deg, var(--gold), #a8844a); border:none; border-radius:12px;
    color:#1a1408; font-weight:700; padding:0 24px; font-size:15px; cursor:pointer; transition: opacity .2s;
  }
  .input-bar button:hover { opacity:.85; }
  .input-bar select {
    background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:12px;
    padding:13px 10px; color:var(--text); font-size:14px; outline:none; cursor:pointer;
  }
  .input-bar select option { background:#151a3a; color:var(--text); }
  .foot { text-align:center; color:var(--dim); font-size:11px; padding-bottom:10px; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="app">
  <header>
    <div class="moon"></div>
    <div class="brand">
      <h1>🌙 Cyber Nyx · 小夜</h1>
      <p>夜之女神 · 赛博助手 · Hermes 内核</p>
    </div>
    <div class="status"><span class="dot"></span><span id="mode">连接中</span></div>
    <div class="mode-switch" id="modeSwitch" title="切换工作 / 陪伴模式">
      <button data-mode="companion">🌙 陪伴</button>
      <button data-mode="work">⚡ 工作</button>
    </div>
    <button class="mem-btn" id="setBtn" title="设置：接入内核 / LLM">⚙️ 设置</button>
    <button class="mem-btn" id="memBtn" title="查看 Nyx 的记忆">🧠 记忆</button>
    <button class="new-chat" id="newChat" title="开启新对话">新对话</button>
  </header>

  <div class="avatar-zone">
    <div class="avatar" id="avatar">🌙</div>
  </div>

  <div class="chat" id="chat">
    <div class="bubble nyx">夜安，主人。今晚想让我陪你做什么呢~</div>
  </div>

  <div class="input-bar">
    <input id="msg" placeholder="跟小夜说点什么…（也可以让它帮你做事）" autocomplete="off">
    <select id="fmt">
      <option value="text">文本</option>
      <option value="json">JSON</option>
      <option value="sse">流式</option>
    </select>
    <button id="send">发送</button>
  </div>
  <div class="foot">Cyber Nyx v0.7 · 小夜 · 历史恢复 / 记忆面板 / WS 实时关心 / 模式切换</div>
</div>

<div class="memory-panel" id="memoryPanel">
  <div class="memory-panel-head">
    <span>🧠 Nyx 的记忆</span>
    <button class="memory-close" id="memClose" title="关闭">✕</button>
  </div>
  <div class="memory-list" id="memoryList"><div class="mem-empty">正在读取记忆…</div></div>
  <div class="memory-foot" id="memoryFoot"></div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-head">
    <span>⚙️ 设置 · 接入内核 / LLM</span>
    <button class="settings-close" id="setClose" title="关闭">✕</button>
  </div>
  <div class="settings-body">
    <div class="settings-status" id="setStatus">正在读取配置…</div>

    <div class="settings-sec">
      <h3>🌐 LLM 接入（OpenAI 兼容 API）</h3>
      <div class="settings-field">
        <label>API 地址</label>
        <input id="cfgBase" placeholder="https://api.openai.com/v1" autocomplete="off">
      </div>
      <div class="settings-field">
        <label>API Key（留空 = 不修改）</label>
        <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="settings-field">
        <label>模型</label>
        <input id="cfgModel" placeholder="gpt-4o-mini" autocomplete="off">
      </div>
    </div>

    <div class="settings-sec">
      <h3>⚡ Hermes 内核</h3>
      <div class="settings-field">
        <label>可执行路径（留空 = 自动探测）</label>
        <input id="cfgHermesBin" placeholder="hermes 或 /usr/local/lib/hermes-agent/venv/bin/hermes" autocomplete="off">
      </div>
      <div class="settings-field">
        <label>模型</label>
        <input id="cfgHermesModel" placeholder="默认随 Hermes" autocomplete="off">
      </div>
      <div class="settings-field">
        <label>Provider</label>
        <input id="cfgHermesProvider" placeholder="可选" autocomplete="off">
      </div>
    </div>

    <button class="settings-save" id="setSave">保存并应用</button>
    <div class="settings-msg" id="setMsg"></div>
  </div>
</div>

<script>
  const stars = document.getElementById('stars');
  for (let i=0;i<90;i++) {
    const s = document.createElement('div');
    s.className='star';
    const sz = Math.random()*2.4 + 0.6;
    s.style.width = s.style.height = sz + 'px';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*3 + 's';
    stars.appendChild(s);
  }

  const chat = document.getElementById('chat');
  const avatar = document.getElementById('avatar');
  const input = document.getElementById('msg');
  const modeEl = document.getElementById('mode');

  fetch('/api/status').then(r=>r.json()).then(d => {
    if (d.core === 'hermes') modeEl.textContent = 'Hermes 内核·记忆在线';
    else modeEl.textContent = '本地演示';
  }).catch(()=>{});

  // --- 模式切换：陪伴 / 工作 ---
  const modeSwitch = document.getElementById('modeSwitch');
  const modeBtns = modeSwitch.querySelectorAll('button');

  function setModeUI(mode) {
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  // 初始化：拉取当前模式
  fetch('/api/mode').then(r=>r.json()).then(d => setModeUI(d.mode)).catch(()=>{});
  // 点击切换
  modeSwitch.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || btn.classList.contains('active')) return;
    const mode = btn.dataset.mode;
    fetch('/api/mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    }).then(r=>r.json()).then(d => {
      setModeUI(d.mode);
      addBubble('小夜切换到了' + (d.mode === 'work' ? '⚡ 工作模式' : '🌙 陪伴模式') + '，' + (d.message || ''), 'nyx');
    }).catch(()=>{});
  });

  // --- 会话管理：localStorage 持久化 session_id ---
  const SESSION_KEY = 'cyber_nyx_session_id';
  let sessionId = localStorage.getItem(SESSION_KEY) || '';

  async function ensureSession() {
    // 没有 session_id 时向服务端申请一个
    if (sessionId) return sessionId;
    try {
      const resp = await fetch('/api/session/new');
      const d = await resp.json();
      sessionId = d.session_id;
      localStorage.setItem(SESSION_KEY, sessionId);
    } catch (e) {
      sessionId = 'default';
    }
    return sessionId;
  }

  async function resetSession() {
    // 新对话：删除旧会话，重新申请 session_id
    if (sessionId) {
      try { await fetch('/api/session/' + sessionId, { method: 'DELETE' }); } catch (e) {}
    }
    sessionId = '';
    localStorage.removeItem(SESSION_KEY);
    chat.innerHTML = '';
    addBubble('主人，我们重新开始吧~ 今晚想聊些什么呢？', 'nyx');
    await ensureSession();
    // 换新 session 后重连 WS（旧连接推送已无意义）
    if (ws) { try { ws.close(); } catch (e) {} }
    ws = null; wsFailed = false;
    connectWS();
  }

  document.getElementById('newChat').onclick = () => {
    if (chat.querySelectorAll('.bubble').length > 1 && !confirm('开启新对话会清空当前聊天记录，确定吗？')) return;
    resetSession();
  };

  // --- 主动关心：WebSocket 实时推送（断线时回退到轮询） ---
  let ws = null;
  let wsFailed = false;

  function connectWS() {
    if (!sessionId || wsFailed) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/ws?session_id=' + encodeURIComponent(sessionId);
    try { ws = new WebSocket(url); } catch (e) { wsFailed = true; return; }
    ws.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.type === 'care' && d.message) addBubble(d.message, 'nyx');
      } catch (e) {}
    };
    ws.onclose = () => { ws = null; wsFailed = true; };
    ws.onerror = () => { wsFailed = true; };
  }

  async function checkProactiveCare() {
    // WS 已连接时由服务端推送，跳过轮询避免重复
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!sessionId) await ensureSession();
    try {
      const resp = await fetch('/api/care?session_id=' + encodeURIComponent(sessionId));
      const data = await resp.json();
      if (data.care && data.message) {
        addBubble(data.message, 'nyx');
      }
    } catch (e) { /* 静默 */ }
  }

  // --- 历史恢复：刷新页面后从服务端拉回会话历史 ---
  async function loadHistory() {
    if (!sessionId) return;
    try {
      const resp = await fetch('/api/session/' + encodeURIComponent(sessionId) + '/history');
      const d = await resp.json();
      const msgs = d.messages || [];
      if (!msgs.length) return;
      chat.innerHTML = '';
      for (const m of msgs) {
        addBubble(m.content, m.role === 'user' ? 'me' : 'nyx');
        if (m.role === 'user') setEmotion(m.emotion);
      }
    } catch (e) { /* 静默 */ }
  }

  // --- 记忆面板：查看 / 删除 Nyx 的记忆 ---
  const memPanel = document.getElementById('memoryPanel');
  const memList = document.getElementById('memoryList');
  const memFoot = document.getElementById('memoryFoot');

  async function refreshMemory() {
    memList.innerHTML = '<div class="mem-empty">正在读取记忆…</div>';
    memFoot.textContent = '';
    try {
      const resp = await fetch('/api/memory?limit=50');
      const d = await resp.json();
      const mems = d.memories || [];
      if (d.enabled === false) {
        memList.innerHTML = '<div class="mem-empty">记忆系统未启用（演示模式）</div>';
        return;
      }
      if (d.ok === false) {
        memList.innerHTML = '<div class="mem-empty">' + (d.error || '读取失败') + '</div>';
        return;
      }
      if (!mems.length) {
        memList.innerHTML = '<div class="mem-empty">还没有记忆呢~ 多跟小夜聊聊吧</div>';
        return;
      }
      memList.innerHTML = '';
      mems.forEach(m => {
        const row = document.createElement('div');
        row.className = 'mem-item';
        const info = document.createElement('div');
        info.className = 'mem-info';
        const content = document.createElement('div');
        content.className = 'mem-content';
        content.textContent = m.content;
        const meta = document.createElement('div');
        meta.className = 'mem-meta';
        const t = m.timestamp ? new Date(m.timestamp).toLocaleString() : '';
        const tag = m.mem_type || (m.tags && m.tags[0]) || '';
        meta.textContent = (t ? t : '') + (tag ? ' · ' + tag : '');
        info.appendChild(content);
        info.appendChild(meta);
        const del = document.createElement('button');
        del.className = 'mem-del';
        del.textContent = '忘掉';
        del.title = '删除这条记忆';
        del.onclick = async () => {
          try {
            const resp = await fetch('/api/memory/' + encodeURIComponent(m.id), { method: 'DELETE' });
            const r = await resp.json();
            if (r.ok) {
              row.remove();
              if (!memList.children.length) {
                memList.innerHTML = '<div class="mem-empty">还没有记忆呢~ 多跟小夜聊聊吧</div>';
              }
            } else {
              memFoot.textContent = r.error || '删除失败';
            }
          } catch (e) {
            memFoot.textContent = '删除失败';
          }
        };
        row.appendChild(info);
        row.appendChild(del);
        memList.appendChild(row);
      });
    } catch (e) {
      memList.innerHTML = '<div class="mem-empty">读取失败</div>';
    }
  }

  document.getElementById('memBtn').onclick = () => {
    setPanel.classList.remove('open');
    memPanel.classList.add('open');
    refreshMemory();
  };
  document.getElementById('memClose').onclick = () => memPanel.classList.remove('open');
  memPanel.addEventListener('click', (e) => { if (e.target === memPanel) memPanel.classList.remove('open'); });

  // --- 设置面板：接入 LLM / Hermes 内核 ---
  const setPanel = document.getElementById('settingsPanel');
  const setStatus = document.getElementById('setStatus');
  const setMsg = document.getElementById('setMsg');
  const cfgBase = document.getElementById('cfgBase');
  const cfgKey = document.getElementById('cfgKey');
  const cfgModel = document.getElementById('cfgModel');
  const cfgHBin = document.getElementById('cfgHermesBin');
  const cfgHModel = document.getElementById('cfgHermesModel');
  const cfgHProvider = document.getElementById('cfgHermesProvider');

  function renderSetStatus(d) {
    const llmTxt = d.llm.configured ? '<span class="ok">✅ LLM 已配置</span>' : '<span class="bad">⚠️ LLM 未配置（本地演示）</span>';
    const hTxt = d.hermes.online ? '<span class="ok">✅ Hermes 内核在线</span>' : '<span class="bad">⚠️ Hermes 内核离线</span>';
    const mTxt = d.memory.enabled ? '<span class="ok">✅ 记忆系统在线</span>' : '<span class="bad">⚠️ 记忆系统离线</span>';
    setStatus.innerHTML = llmTxt + '<br>' + hTxt + '<br>' + mTxt;
  }

  function loadSettings() {
    fetch('/api/settings').then(r => r.json()).then(d => {
      renderSetStatus(d);
      cfgBase.value = d.llm.base || '';
      cfgKey.placeholder = d.llm.key ? '已保存：' + d.llm.key + '（留空不修改）' : 'sk-...';
      cfgKey.value = '';
      cfgModel.value = d.llm.model || 'gpt-4o-mini';
      cfgHBin.value = d.hermes.bin || '';
      cfgHModel.value = d.hermes.model || '';
      cfgHProvider.value = d.hermes.provider || '';
    }).catch(() => { setStatus.textContent = '读取配置失败'; });
  }

  document.getElementById('setBtn').onclick = () => {
    memPanel.classList.remove('open');
    setPanel.classList.add('open');
    setMsg.textContent = '';
    loadSettings();
  };
  document.getElementById('setClose').onclick = () => setPanel.classList.remove('open');
  setPanel.addEventListener('click', (e) => { if (e.target === setPanel) setPanel.classList.remove('open'); });

  document.getElementById('setSave').onclick = () => {
    setMsg.textContent = '保存中…';
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        llm: { base: cfgBase.value.trim(), key: cfgKey.value.trim(), model: cfgModel.value.trim() },
        hermes: { bin: cfgHBin.value.trim(), model: cfgHModel.value.trim(), provider: cfgHProvider.value.trim() },
      }),
    }).then(r => r.json()).then(d => {
      if (d.ok) {
        setMsg.className = 'settings-msg ok';
        setMsg.textContent = d.message || '设置已保存并生效';
        renderSetStatus(d);
        cfgKey.value = '';
        cfgKey.placeholder = '已保存（留空不修改）';
      } else {
        setMsg.className = 'settings-msg err';
        setMsg.textContent = '保存失败';
      }
    }).catch(() => {
      setMsg.className = 'settings-msg err';
      setMsg.textContent = '保存失败：无法连接服务';
    });
  };

  // --- 页面初始化：恢复历史 → 连接 WS → 轮询兜底 ---
  (async () => {
    await ensureSession();
    await loadHistory();
    connectWS();
    // 首次问候：WS 未连通时 3 秒后轮询一次，之后每 5 分钟兜底
    setTimeout(() => {
      checkProactiveCare();
      setInterval(checkProactiveCare, 5 * 60 * 1000);
    }, 3000);
  })();

  function addBubble(text, who) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  // --- 打字机效果：逐字显示 Nyx 回复 ---
  const TYPE_SPEED = 28; // 每字符间隔 ms

  function typeBubble(text, who, done) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    b.appendChild(cursor);
    chat.appendChild(b);

    let i = 0;
    function step() {
      if (i < text.length) {
        // 成块插入（中文按 1-3 字符，避免逐字闪烁过快）
        const n = /[\x00-\x7f]/.test(text[i]) ? 1 : 2;
        b.insertBefore(document.createTextNode(text.slice(i, i + n)), cursor);
        i += n;
        chat.scrollTop = chat.scrollHeight;
        setTimeout(step, TYPE_SPEED);
      } else {
        cursor.remove();
        if (done) done(b);
      }
    }
    step();
    return b;
  }

  function setEmotion(e) {
    avatar.className = 'avatar';
    if (e && e !== 'neutral') avatar.classList.add(e);
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg) return;
    addBubble(msg, 'me');
    input.value = '';
    await ensureSession();
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = '小夜正在思索…';
    chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

    const fmt = document.getElementById('fmt').value;
    const url = fmt === 'sse' ? '/api/chat/stream' : '/api/chat';
    const opts = {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, format: fmt, session_id: sessionId}),
    };

    try {
      if (fmt === 'sse') {
        const resp = await fetch(url, opts);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = '';
        let finished = false;
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) {
              const d = JSON.parse(line.slice(6));
              if (d.chunk) {
                fullReply += d.chunk;
                typing.textContent = fullReply + '…';
                chat.scrollTop = chat.scrollHeight;
              }
              if (d.done) {
                finished = true;
                if (d.session_id) {
                  sessionId = d.session_id;
                  localStorage.setItem(SESSION_KEY, sessionId);
                }
                typing.remove();
                setEmotion(d.emotion);
                // 收到完整回复后用打字机效果展示
                setTimeout(() => typeBubble(d.reply || fullReply, 'nyx'), 250);
                return;
              }
            }
          }
        }
        if (!finished) {
          typing.remove();
          typeBubble(fullReply || '嗯？主人没有说话呢~', 'nyx');
        }
      } else {
        const r = await fetch(url, opts);
        const d = await r.json();
        if (d.session_id) {
          sessionId = d.session_id;
          localStorage.setItem(SESSION_KEY, sessionId);
        }
        typing.remove();
        setEmotion(d.emotion);
        setTimeout(() => typeBubble(d.reply, 'nyx'), 250);
      }
    } catch(e) {
      typing.remove();
      addBubble('唔，网络有些不乖呢，主人稍后再试好不好~', 'nyx');
    }
  }

  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
