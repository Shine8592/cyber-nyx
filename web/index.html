<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Nyx · 夜之女神赛博助手</title>
<style>
  :root {
    /* Carbon dark premium · 月金 accent */
    --surface-0: oklch(14% 0.012 260);
    --surface-1: oklch(17.5% 0.012 260);
    --surface-2: oklch(21% 0.012 260);
    --surface-3: oklch(25% 0.012 260);
    --line:      oklch(30% 0.015 260);
    --line-soft: oklch(24% 0.012 260);
    --text-1:    oklch(94% 0.005 260);
    --text-2:    oklch(72% 0.01 260);
    --text-3:    oklch(55% 0.012 260);

    --accent:       oklch(80% 0.11 85);
    --accent-hover: oklch(86% 0.10 85);
    --accent-tint:  oklch(80% 0.11 85 / 0.10);
    --on-accent:    oklch(16% 0.01 85);

    --success: oklch(76% 0.12 155);
    --danger:  oklch(70% 0.16 25);

    --radius-input: 8px;
    --radius-card: 12px;
    --radius-modal: 16px;
    --radius-bubble: 14px;

    --motion-fast: 120ms;
    --motion-base: 180ms;
    --motion-slow: 300ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --font-sans: "PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,-apple-system,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font-sans);
    background:
      radial-gradient(880px 460px at 50% -180px, oklch(80% 0.11 85 / 0.05), transparent 70%),
      var(--surface-0);
    color: var(--text-1);
    height:100vh; overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; max-width:880px; margin:0 auto; padding:16px 20px 0; }

  /* header */
  header { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
  .moon-logo { width:28px; height:28px; color:var(--accent); flex-shrink:0; }
  .brand h1 { font-size:17px; font-weight:650; letter-spacing:-0.01em; }
  .brand p { font-size:11px; color:var(--text-3); margin-top:1px; letter-spacing:0.03em; }
  .status { margin-left:auto; font-size:11px; color:var(--text-2); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--success); }

  /* 模式切换 */
  .mode-switch { display:flex; align-items:center; gap:2px; padding:2px; border:1px solid var(--line); border-radius:999px; background:var(--surface-1); }
  .mode-switch button {
    border:none; background:transparent; color:var(--text-2); font-size:12px;
    padding:4px 10px; border-radius:999px; cursor:pointer;
    transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
  }
  .mode-switch button:hover { color:var(--text-1); }
  .mode-switch button.active { background:var(--surface-3); color:var(--accent); }

  /* 图标按钮 */
  .icon-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:8px;
    background:transparent; border:1px solid var(--line); color:var(--text-2); cursor:pointer;
    transition: color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
  }
  .icon-btn:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-tint); }
  .icon-btn svg { width:15px; height:15px; }

  .new-chat {
    background:transparent; border:1px solid var(--line); color:var(--text-2);
    border-radius:8px; padding:6px 11px; font-size:12px; cursor:pointer;
    transition: color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
  }
  .new-chat:hover { color:var(--text-1); border-color:var(--accent); background:var(--accent-tint); }

  /* 月徽（签名细节） */
  .avatar-zone { display:flex; justify-content:center; padding:26px 0 14px; }
  .avatar {
    width:76px; height:76px; border-radius:50%;
    color:var(--accent);
    background: radial-gradient(circle at 32% 30%, var(--surface-2), var(--surface-1));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    transition: transform var(--motion-base) var(--ease-out), filter var(--motion-base) var(--ease-out);
  }
  .avatar svg { width:38px; height:38px; }
  .avatar.happy { transform: translateY(-2px); }
  .avatar.sad { filter: brightness(.85); }
  .avatar.curious { transform: rotate(-6deg); }
  .avatar.angry { transform: translateY(1px); filter: brightness(.9) saturate(1.2); }
  .avatar.surprised { transform: scale(1.06); }
  .avatar.shy { transform: translateY(3px) scale(.97); }

  /* 聊天区 */
  .chat {
    flex:1; overflow-y:auto; padding:4px 2px 12px; display:flex; flex-direction:column; gap:10px;
    scrollbar-width:thin; scrollbar-color: var(--line) transparent;
  }
  .bubble {
    max-width:76%; padding:10px 14px; border-radius:var(--radius-bubble);
    font-size:14.5px; line-height:1.6;
    animation: rise var(--motion-base) var(--ease-out);
  }
  @keyframes rise { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .nyx { align-self:flex-start; background:var(--surface-1); border:1px solid var(--line-soft); border-bottom-left-radius:5px; }
  .me { align-self:flex-end; background:var(--accent-tint); border:1px solid oklch(80% 0.11 85 / 0.25); border-bottom-right-radius:5px; }
  .typing { color:var(--text-3); font-size:13px; align-self:flex-start; padding:6px 4px; }
  .typing-cursor {
    display:inline-block; width:2px; height:1em; background:var(--accent);
    margin-left:2px; vertical-align:-2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }

  /* 输入栏 */
  .input-bar { display:flex; align-items:center; gap:8px; padding:12px 0 14px; }
  .input-bar input {
    flex:1; min-width:0; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--radius-input);
    padding:11px 14px; color:var(--text-1); font-size:14px; font-family:inherit; outline:none;
    transition: border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out);
  }
  .input-bar input::placeholder { color:var(--text-3); }
  .input-bar input:focus { border-color:var(--accent); box-shadow:0 0 0 3px oklch(80% 0.11 85 / 0.14); }
  .mic-btn { background:var(--surface-1); border:1px solid var(--line); border-radius:var(--radius-input); width:42px; height:42px; flex:0 0 42px; display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:pointer; transition:color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out); }
  .mic-btn:hover { color:var(--accent); border-color:var(--accent); }
  .mic-btn.rec { color:#fff; background:#e5484d; border-color:#e5484d; animation:micPulse 1.2s infinite; }
  @keyframes micPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(229,72,77,.4);} 50%{ box-shadow:0 0 0 7px rgba(229,72,77,0);} }
  .input-bar select {
    background:var(--surface-1); border:1px solid var(--line); color:var(--text-2);
    border-radius:var(--radius-input); padding:10px 8px; font-size:12px; outline:none; cursor:pointer;
  }
  .input-bar button {
    display:inline-flex; align-items:center; justify-content:center;
    width:42px; height:42px; border-radius:var(--radius-input);
    background:var(--accent); color:var(--on-accent); border:none; cursor:pointer;
    box-shadow: 0 0 16px oklch(80% 0.11 85 / 0.18);
    transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
  }
  .input-bar button:hover { background:var(--accent-hover); }
  .input-bar button:active { transform:scale(.97); }
  .input-bar button svg { width:18px; height:18px; }

  /* 语音：开关 + 音色选择 */
  .voice-toggle.on { color:var(--accent); border-color:var(--accent); background:var(--accent-tint); }
  .voice-sel {
    background:var(--surface-1); border:1px solid var(--line); color:var(--text-2);
    border-radius:8px; padding:4px 6px; font-size:11px; outline:none; cursor:pointer;
    max-width:96px; transition: border-color var(--motion-fast) var(--ease-out);
  }
  .voice-sel:hover { border-color:var(--accent); }
  .voice-sel:focus { border-color:var(--accent); }
  .voice-sel option { background:var(--surface-2); color:var(--text-1); }

  /* 声音克隆：环境检测 / 安装 / 训练 */
  .env-list { display:flex; flex-direction:column; gap:5px; margin:8px 0 10px; }
  .env-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); }
  .env-item .env-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .env-item.ok .env-dot { background:var(--success); }
  .env-item.bad .env-dot { background:var(--danger); }
  .env-item.busy .env-dot { background:var(--accent); }
  .env-item .env-name { flex-shrink:0; min-width:120px; }
  .env-item .env-msg { color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .settings-btn {
    width:100%; margin-top:6px; padding:9px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-1); color:var(--text-1); font-size:13px; cursor:pointer;
    transition: border-color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
  }
  .settings-btn:hover { border-color:var(--accent); background:var(--accent-tint); }
  .settings-btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .settings-btn.primary:hover { background:var(--accent-hover); }
  .settings-btn:disabled { opacity:.5; cursor:not-allowed; }
  .train-box { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-soft); }
  .train-epochs { display:flex; gap:8px; }
  .train-epochs input {
    flex:1; background:var(--surface-1); border:1px solid var(--line); border-radius:6px;
    padding:7px 9px; color:var(--text-1); font-size:13px; outline:none; font-family:inherit;
  }
  .progress-wrap { margin-top:10px; }
  .progress-bar {
    height:6px; border-radius:3px; background:var(--surface-1); border:1px solid var(--line-soft); overflow:hidden;
  }
  .progress-fill {
    height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg, var(--accent), oklch(80% 0.11 85 / .6));
    transition: width var(--motion-base) var(--ease-out);
  }
  .progress-txt { font-size:11px; color:var(--text-3); margin-top:5px; }
  .train-log {
    margin-top:6px; max-height:150px; overflow-y:auto; padding:7px 9px; font-size:10.5px; line-height:1.55;
    font-family:Consolas, Menlo, monospace; color:var(--text-2);
    background:var(--surface-1); border:1px solid var(--line-soft); border-radius:6px;
    scrollbar-width:thin; scrollbar-color: var(--line) transparent; white-space:pre-wrap; word-break:break-all;
  }

  .foot { text-align:center; color:var(--text-3); font-size:11px; padding-bottom:8px; }

  /* 侧滑面板：surface 分层，无大阴影 */
  .memory-panel, .settings-panel {
    position:fixed; top:0; right:-380px; width:360px; height:100vh; z-index:30;
    background:var(--surface-2);
    border-left:1px solid var(--line);
    box-shadow: -20px 0 50px oklch(0% 0 0 / 0.35);
    display:flex; flex-direction:column;
    transition: right var(--motion-slow) var(--ease-out); padding:18px 16px;
  }
  .settings-panel { z-index:40; }
  .memory-panel.open, .settings-panel.open { right:0; }
  .memory-panel-head, .settings-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
  .panel-title { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--text-1); }
  .panel-title svg { width:16px; height:16px; color:var(--accent); }
  .memory-close, .settings-close {
    background:transparent; border:none; color:var(--text-3); font-size:15px; cursor:pointer;
    padding:4px 6px; border-radius:6px;
    transition: color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
  }
  .memory-close:hover, .settings-close:hover { color:var(--text-1); background:var(--surface-1); }
  .memory-list { flex:1; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .mem-item {
    background:var(--surface-1); border:1px solid var(--line-soft); border-radius:var(--radius-card);
    padding:10px 12px; display:flex; align-items:flex-start; gap:8px;
    transition: border-color var(--motion-fast) var(--ease-out);
  }
  .mem-item:hover { border-color:var(--line); }
  .mem-info { flex:1; min-width:0; }
  .mem-content { font-size:13px; color:var(--text-1); line-height:1.5; word-break:break-all; }
  .mem-meta { font-size:11px; color:var(--text-3); margin-top:4px; }
  .mem-del {
    flex-shrink:0; background:transparent; border:1px solid var(--line); color:var(--text-3);
    border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer;
    transition: color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out);
  }
  .mem-del:hover { color:var(--danger); border-color:var(--danger); }
  .mem-empty { color:var(--text-3); font-size:13px; text-align:center; padding:30px 10px; }
  .memory-foot { text-align:center; color:var(--text-3); font-size:11px; padding-top:10px; }

  .settings-body { flex:1; overflow-y:auto; margin-top:12px; }
  .settings-sec { margin-bottom:20px; }
  .settings-sec h3 { font-size:12px; color:var(--accent); margin-bottom:10px; font-weight:600; letter-spacing:0.04em; }
  .settings-field { margin-bottom:10px; }
  .settings-field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:5px; }
  .settings-field input {
    width:100%; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--radius-input);
    padding:10px 12px; color:var(--text-1); font-size:13px; font-family:inherit; outline:none; box-sizing:border-box;
    transition: border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out);
  }
  .settings-field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px oklch(80% 0.11 85 / 0.14); }
  .settings-status { font-size:12px; color:var(--text-2); margin:8px 0 4px; line-height:1.6; }
  .settings-status .ok { color:var(--success); }
  .settings-status .bad { color:var(--danger); }
  .settings-save {
    width:100%; background:var(--accent); border:none; border-radius:var(--radius-input);
    color:var(--on-accent); font-weight:650; padding:12px; font-size:14px; cursor:pointer; font-family:inherit;
    transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
  }
  .settings-save:hover { background:var(--accent-hover); }
  .settings-save:active { transform:scale(.99); }
  .settings-msg { text-align:center; font-size:12px; margin-top:10px; min-height:18px; color:var(--text-3); }
  .settings-msg.ok { color:var(--success); }
  .settings-msg.err { color:var(--danger); }

  /* 登录 */
  .login-mask {
    position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
    background: oklch(10% 0.012 260 / 0.72);
    backdrop-filter: blur(6px);
  }
  .login-mask.open { display:flex; }
  .login-box {
    width:320px; max-width:88vw; background:var(--surface-3); border:1px solid var(--line);
    border-radius:var(--radius-modal); padding:28px 26px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow: 0 24px 60px oklch(0% 0 0 / 0.5);
  }
  .login-mark { width:44px; height:44px; color:var(--accent); margin-bottom:2px; }
  .login-box h3 { font-size:15px; font-weight:650; }
  .login-box p { font-size:12px; color:var(--text-3); text-align:center; line-height:1.5; }
  .login-box input {
    width:100%; background:var(--surface-1); border:1px solid var(--line); border-radius:var(--radius-input);
    padding:11px 12px; color:var(--text-1); font-size:14px; font-family:inherit; outline:none; margin-top:8px;
    transition: border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out);
  }
  .login-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px oklch(80% 0.11 85 / 0.14); }
  .login-box button {
    width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:var(--radius-input);
    padding:11px; font-size:14px; font-weight:650; cursor:pointer; font-family:inherit; margin-top:4px;
    transition: background var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
  }
  .login-box button:hover { background:var(--accent-hover); }
  .login-box button:active { transform:scale(.99); }
  .login-err { color:var(--danger); font-size:12px; min-height:16px; }

  /* 滚动条 */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  @media (max-width: 768px) {
    header { gap:8px; padding-bottom:10px; }
    .moon-logo { width:25px; height:25px; }
    .brand h1 { font-size:15px; }
    .brand p { display:none; }
    .status { font-size:10px; }
    .dot { width:5px; height:5px; }
    .icon-btn { width:28px; height:28px; }
    .new-chat { padding:5px 9px; font-size:11px; }
    .mode-switch button { font-size:11px; padding:4px 8px; }
    .avatar-zone { padding:18px 0 10px; }
    .avatar { width:62px; height:62px; }
    .avatar svg { width:30px; height:30px; }
    .bubble { max-width:88%; font-size:14px; padding:9px 12px; }
    .input-bar { gap:8px; padding:10px 0 14px; }
    .input-bar input { font-size:16px; padding:10px 12px; }
    .input-bar button { width:40px; height:40px; }
    .foot { font-size:10px; }
    .memory-panel, .settings-panel { width:100%; right:-100%; }
    .memory-panel.open, .settings-panel.open { right:0; }
    .login-box { width:86%; }
  }
  @media (max-width: 480px) {
    .brand h1 { font-size:14px; }
    .status { display:none; }
    .avatar { width:54px; height:54px; }
    .avatar svg { width:26px; height:26px; }
    .chat { gap:8px; }
    .bubble { max-width:92%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <svg class="moon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <div class="brand">
      <h1>Cyber Nyx · 小夜</h1>
      <p>夜之女神 · 赛博助手 · Hermes 内核</p>
    </div>
    <div class="status"><span class="dot"></span><span id="mode">连接中</span></div>
    <div class="mode-switch" id="modeSwitch" title="切换工作 / 陪伴模式">
      <button data-mode="companion">陪伴</button>
      <button data-mode="work">工作</button>
    </div>
    <button class="icon-btn voice-toggle" id="voiceBtn" title="语音开关（微软 / 克隆）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <select id="voiceSel" class="voice-sel" title="选择音色"></select>
    <button class="icon-btn" id="setBtn" title="设置：接入内核 / LLM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
    </button>
    <button class="icon-btn" id="memBtn" title="查看 Nyx 的记忆">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </button>
    <button class="new-chat" id="newChat" title="开启新对话">新对话</button>
  </header>

            <input id="trainS2" type="number" value="60" min="1" max="200" title="s2 轮数">

<div class="login-mask" id="loginMask">
  <div class="login-box">
    <svg class="login-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      <path d="M16.8 4.4l.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7z"/>
    </svg>
    <h3>夜之女神 · 访问令牌</h3>
    <p>请输入访问令牌（请联系部署者获取）</p>
    <input id="loginInput" type="password" placeholder="nyx-..." autocomplete="off">
    <button id="loginBtn">进入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<script>
  // --- 鉴权：所有请求自动携带访问令牌，401 弹登录框 ---
  const AUTH_KEY = 'cyber_nyx_token';
  function getToken() { return localStorage.getItem(AUTH_KEY) || ''; }
  const _fetch = window.fetch.bind(window);
  window.fetch = function(url, opts) {
    opts = opts || {};
    opts.headers = new Headers(opts.headers || {});
    const t = getToken();
    if (t) opts.headers.set('Authorization', 'Bearer ' + t);
    return _fetch(url, opts).then(r => {
      if (r.status === 401) showLogin();
      return r;
    });
  };
  const loginMask = document.getElementById('loginMask');
  const loginInput = document.getElementById('loginInput');
  const loginErr = document.getElementById('loginErr');
  function showLogin() { loginMask.classList.add('open'); }
  function hideLogin() { loginMask.classList.remove('open'); }
  function doLogin() {
    const t = loginInput.value.trim();
    if (!t) { loginErr.textContent = '令牌不能为空'; return; }
    localStorage.setItem(AUTH_KEY, t);
    hideLogin();
    location.reload();
  }
  document.getElementById('loginBtn').onclick = doLogin;
  loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  const chat = document.getElementById('chat');
  const avatar = document.getElementById('avatar');
  const input = document.getElementById('msg');
  const modeEl = document.getElementById('mode');

  fetch('/api/status').then(r=>r.json()).then(d => {
    if (d.core === 'hermes') modeEl.textContent = 'Hermes 内核·记忆在线';
    else modeEl.textContent = '本地演示';
  }).catch(()=>{});

  // --- 模式切换：陪伴 / 工作 ---
  const modeSwitch = document.getElementById('modeSwitch');
  const modeBtns = modeSwitch.querySelectorAll('button');

  function setModeUI(mode) {
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  // 初始化：拉取当前模式
  fetch('/api/mode').then(r=>r.json()).then(d => setModeUI(d.mode)).catch(()=>{});
  // 点击切换
  modeSwitch.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || btn.classList.contains('active')) return;
    const mode = btn.dataset.mode;
    fetch('/api/mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    }).then(r=>r.json()).then(d => {
      setModeUI(d.mode);
      addBubble('小夜切换到了' + (d.mode === 'work' ? '工作模式' : '陪伴模式') + '，' + (d.message || ''), 'nyx');
    }).catch(()=>{});
  });

  // --- 会话管理：localStorage 持久化 session_id ---
  const SESSION_KEY = 'cyber_nyx_session_id';
  let sessionId = localStorage.getItem(SESSION_KEY) || '';

  async function ensureSession() {
    // 没有 session_id 时向服务端申请一个
    if (sessionId) return sessionId;
    try {
      const resp = await fetch('/api/session/new');
      const d = await resp.json();
      sessionId = d.session_id;
      localStorage.setItem(SESSION_KEY, sessionId);
    } catch (e) {
      sessionId = 'default';
    }
    return sessionId;
  }

  async function resetSession() {
    // 新对话：删除旧会话，重新申请 session_id
    if (sessionId) {
      try { await fetch('/api/session/' + sessionId, { method: 'DELETE' }); } catch (e) {}
    }
    sessionId = '';
    localStorage.removeItem(SESSION_KEY);
    chat.innerHTML = '';
    addBubble('主人，我们重新开始吧~ 今晚想聊些什么呢？', 'nyx');
    await ensureSession();
    // 换新 session 后重连 WS（旧连接推送已无意义）
    if (ws) { try { ws.close(); } catch (e) {} }
    ws = null; wsFailed = false;
    connectWS();
  }

  document.getElementById('newChat').onclick = () => {
    if (chat.querySelectorAll('.bubble').length > 1 && !confirm('开启新对话会清空当前聊天记录，确定吗？')) return;
    resetSession();
  };

  // --- 主动关心：WebSocket 实时推送（断线时回退到轮询） ---
  let ws = null;
  let wsFailed = false;

  function connectWS() {
    if (!sessionId || wsFailed) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/ws?session_id=' + encodeURIComponent(sessionId) + '&token=' + encodeURIComponent(getToken());
    try { ws = new WebSocket(url); } catch (e) { wsFailed = true; return; }
    ws.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.type === 'care' && d.message) addBubble(d.message, 'nyx');
      } catch (e) {}
    };
    ws.onclose = () => { ws = null; wsFailed = true; };
    ws.onerror = () => { wsFailed = true; };
  }

  async function checkProactiveCare() {
    // WS 已连接时由服务端推送，跳过轮询避免重复
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!sessionId) await ensureSession();
    try {
      const resp = await fetch('/api/care?session_id=' + encodeURIComponent(sessionId));
      const data = await resp.json();
      if (data.care && data.message) {
        addBubble(data.message, 'nyx');
      }
    } catch (e) { /* 静默 */ }
  }

  // --- 历史恢复：刷新页面后从服务端拉回会话历史 ---
  async function loadHistory() {
    if (!sessionId) return;
    try {
      const resp = await fetch('/api/session/' + encodeURIComponent(sessionId) + '/history');
      const d = await resp.json();
      const msgs = d.messages || [];
      if (!msgs.length) return;
      chat.innerHTML = '';
      for (const m of msgs) {
        addBubble(m.content, m.role === 'user' ? 'me' : 'nyx');
        if (m.role === 'user') setEmotion(m.emotion);
      }
    } catch (e) { /* 静默 */ }
  }

  // --- 记忆面板：查看 / 删除 Nyx 的记忆 ---
  const memPanel = document.getElementById('memoryPanel');
  const memList = document.getElementById('memoryList');
  const memFoot = document.getElementById('memoryFoot');

  async function refreshMemory() {
    memList.innerHTML = '<div class="mem-empty">正在读取记忆…</div>';
    memFoot.textContent = '';
    try {
      const resp = await fetch('/api/memory?limit=50');
      const d = await resp.json();
      const mems = d.memories || [];
      if (d.enabled === false) {
        memList.innerHTML = '<div class="mem-empty">记忆系统未启用（演示模式）</div>';
        return;
      }
      if (d.ok === false) {
        memList.innerHTML = '<div class="mem-empty">' + (d.error || '读取失败') + '</div>';
        return;
      }
      if (!mems.length) {
        memList.innerHTML = '<div class="mem-empty">还没有记忆呢~ 多跟小夜聊聊吧</div>';
        return;
      }
      memList.innerHTML = '';
      mems.forEach(m => {
        const row = document.createElement('div');
        row.className = 'mem-item';
        const info = document.createElement('div');
        info.className = 'mem-info';
        const content = document.createElement('div');
        content.className = 'mem-content';
        content.textContent = m.content;
        const meta = document.createElement('div');
        meta.className = 'mem-meta';
        const t = m.timestamp ? new Date(m.timestamp).toLocaleString() : '';
        const tag = m.mem_type || (m.tags && m.tags[0]) || '';
        meta.textContent = (t ? t : '') + (tag ? ' · ' + tag : '');
        info.appendChild(content);
        info.appendChild(meta);
        const del = document.createElement('button');
        del.className = 'mem-del';
        del.textContent = '忘掉';
        del.title = '删除这条记忆';
        del.onclick = async () => {
          try {
            const resp = await fetch('/api/memory/' + encodeURIComponent(m.id), { method: 'DELETE' });
            const r = await resp.json();
            if (r.ok) {
              row.remove();
              if (!memList.children.length) {
                memList.innerHTML = '<div class="mem-empty">还没有记忆呢~ 多跟小夜聊聊吧</div>';
              }
            } else {
              memFoot.textContent = r.error || '删除失败';
            }
          } catch (e) {
            memFoot.textContent = '删除失败';
          }
        };
        row.appendChild(info);
        row.appendChild(del);
        memList.appendChild(row);
      });
    } catch (e) {
      memList.innerHTML = '<div class="mem-empty">读取失败</div>';
    }
  }

  document.getElementById('memBtn').onclick = () => {
    setPanel.classList.remove('open');
    memPanel.classList.add('open');
    refreshMemory();
  };
  document.getElementById('memClose').onclick = () => memPanel.classList.remove('open');
  memPanel.addEventListener('click', (e) => { if (e.target === memPanel) memPanel.classList.remove('open'); });

  // --- 设置面板：接入 LLM / Hermes 内核 ---
  const setPanel = document.getElementById('settingsPanel');
  const setStatus = document.getElementById('setStatus');
  const setMsg = document.getElementById('setMsg');
  const cfgBase = document.getElementById('cfgBase');
  const cfgKey = document.getElementById('cfgKey');
  const cfgModel = document.getElementById('cfgModel');
  const cfgHBin = document.getElementById('cfgHermesBin');
  const cfgHModel = document.getElementById('cfgHermesModel');
  const cfgHProvider = document.getElementById('cfgHermesProvider');

  function renderSetStatus(d) {
    const llmTxt = d.llm.configured ? '<span class="ok">LLM 已配置</span>' : '<span class="bad">LLM 未配置（本地演示）</span>';
    const hTxt = d.hermes.online ? '<span class="ok">Hermes 内核在线</span>' : '<span class="bad">Hermes 内核离线</span>';
    const mTxt = d.memory.enabled ? '<span class="ok">记忆系统在线</span>' : '<span class="bad">记忆系统离线</span>';
    setStatus.innerHTML = llmTxt + '<br>' + hTxt + '<br>' + mTxt;
  }

  function loadSettings() {
    fetch('/api/settings').then(r => r.json()).then(d => {
      renderSetStatus(d);
      cfgBase.value = d.llm.base || '';
      cfgKey.placeholder = d.llm.key ? '已保存：' + d.llm.key + '（留空不修改）' : 'sk-...';
      cfgKey.value = '';
      cfgModel.value = d.llm.model || 'gpt-4o-mini';
      cfgHBin.value = d.hermes.bin || '';
      cfgHModel.value = d.hermes.model || '';
      cfgHProvider.value = d.hermes.provider || '';
    }).catch(() => { setStatus.textContent = '读取配置失败'; });
  }

  document.getElementById('setBtn').onclick = () => {
    memPanel.classList.remove('open');
    setPanel.classList.add('open');
    setMsg.textContent = '';
    loadSettings();
    refreshEnv();
    refreshHermes();
    refreshStt();
  };
  document.getElementById('setClose').onclick = () => setPanel.classList.remove('open');
  setPanel.addEventListener('click', (e) => { if (e.target === setPanel) setPanel.classList.remove('open'); });

  document.getElementById('setSave').onclick = () => {
    setMsg.textContent = '保存中…';
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        llm: { base: cfgBase.value.trim(), key: cfgKey.value.trim(), model: cfgModel.value.trim() },
        hermes: { bin: cfgHBin.value.trim(), model: cfgHModel.value.trim(), provider: cfgHProvider.value.trim() },
      }),
    }).then(r => r.json()).then(d => {
      if (d.ok) {
        setMsg.className = 'settings-msg ok';
        setMsg.textContent = d.message || '设置已保存并生效';
        renderSetStatus(d);
        cfgKey.value = '';
        cfgKey.placeholder = '已保存（留空不修改）';
      } else {
        setMsg.className = 'settings-msg err';
        setMsg.textContent = '保存失败';
      }
    }).catch(() => {
      setMsg.className = 'settings-msg err';
      setMsg.textContent = '保存失败：无法连接服务';
    });
  };

  // --- 页面初始化：恢复历史 → 连接 WS → 轮询兜底 ---
  (async () => {
    await ensureSession();
    await loadHistory();
    connectWS();
    // 首次问候：WS 未连通时 3 秒后轮询一次，之后每 5 分钟兜底
    setTimeout(() => {
      checkProactiveCare();
      setInterval(checkProactiveCare, 5 * 60 * 1000);
    }, 3000);
  })();

  function addBubble(text, who) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  // --- 打字机效果：逐字显示 Nyx 回复 ---
  const TYPE_SPEED = 28; // 每字符间隔 ms

  function typeBubble(text, who, done) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    b.appendChild(cursor);
    chat.appendChild(b);

    let i = 0;
    function step() {
      if (i < text.length) {
        // 成块插入（中文按 1-3 字符，避免逐字闪烁过快）
        const n = /[\x00-\x7f]/.test(text[i]) ? 1 : 2;
        b.insertBefore(document.createTextNode(text.slice(i, i + n)), cursor);
        i += n;
        chat.scrollTop = chat.scrollHeight;
        setTimeout(step, TYPE_SPEED);
      } else {
        cursor.remove();
        if (done) done(b);
      }
    }
    step();
    return b;
  }

  function setEmotion(e) {
    avatar.className = 'avatar';
    if (e && e !== 'neutral') avatar.classList.add(e);
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg) return;
    addBubble(msg, 'me');
    input.value = '';
    await ensureSession();
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = '小夜正在思索…';
    chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

    const fmt = document.getElementById('fmt').value;
    const url = fmt === 'sse' ? '/api/chat/stream' : '/api/chat';
    const opts = {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, format: fmt, session_id: sessionId}),
    };

    try {
      if (fmt === 'sse') {
        const resp = await fetch(url, opts);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = '';
        let finished = false;
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) {
              const d = JSON.parse(line.slice(6));
              if (d.chunk) {
                fullReply += d.chunk;
                typing.textContent = fullReply + '…';
                chat.scrollTop = chat.scrollHeight;
              }
              if (d.done) {
                finished = true;
                if (d.session_id) {
                  sessionId = d.session_id;
                  localStorage.setItem(SESSION_KEY, sessionId);
                }
                typing.remove();
                setEmotion(d.emotion);
                const finalReply = d.reply || fullReply;
                setTimeout(() => {
                  typeBubble(finalReply, 'nyx');
                  setTimeout(() => speak(finalReply), 700);
                }, 250);
                return;
              }
            }
          }
        }
        if (!finished) {
          typing.remove();
          typeBubble(fullReply || '嗯？主人没有说话呢~', 'nyx');
        }
      } else {
        const r = await fetch(url, opts);
        const d = await r.json();
        if (d.session_id) {
          sessionId = d.session_id;
          localStorage.setItem(SESSION_KEY, sessionId);
        }
        typing.remove();
        setEmotion(d.emotion);
        const finalReply = d.reply;
        setTimeout(() => {
          typeBubble(finalReply, 'nyx');
          setTimeout(() => speak(finalReply), 700);
        }, 250);
      }
    } catch(e) {
      typing.remove();
      addBubble('唔，网络有些不乖呢，主人稍后再试好不好~', 'nyx');
    }
  }

  // --- 语音：微软 edge-tts + GPT-SoVITS 克隆 ---
  const VOICE_KEY = 'cyber_nyx_voice';
  const VOICE_ON_KEY = 'cyber_nyx_voice_on';
  let voiceEnabled = localStorage.getItem(VOICE_ON_KEY) === '1';
  let curVoice = localStorage.getItem(VOICE_KEY) || 'night';
  let audioEl = null;
  const voiceBtn = document.getElementById('voiceBtn');
  const voiceSel = document.getElementById('voiceSel');

  function refreshVoices() {
    fetch('/api/voices').then(r => r.json()).then(d => {
      const prev = voiceSel.value || curVoice;
      voiceSel.innerHTML = '';
      (d.voices || []).forEach(v => {
        const o = document.createElement('option');
        o.value = v.id;
        o.textContent = v.name + '·微软' + (v.gender === '女' ? '女' : '男');
        voiceSel.appendChild(o);
      });
      (d.clones || []).forEach(c => {
        const o = document.createElement('option');
        o.value = 'clone:' + c.name;
        o.textContent = c.name + '·克隆';
        voiceSel.appendChild(o);
      });
      if (prev) voiceSel.value = prev;
    }).catch(() => {});
  }

  function speak(text) {
    if (!voiceEnabled || !text) return;
    const clean = text.replace(/```[\s\S]*?```/g, '').replace(/[#*_`>\[\]()]/g, '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    if (audioEl) { audioEl.pause(); audioEl = null; }
    fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: clean.slice(0, 500), voice: curVoice }),
    }).then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); })
      .then(b => {
        audioEl = new Audio(URL.createObjectURL(b));
        audioEl.onended = () => { URL.revokeObjectURL(audioEl.src); audioEl = null; };
        audioEl.play().catch(() => {});
      }).catch(() => {});
  }

  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem(VOICE_ON_KEY, voiceEnabled ? '1' : '0');
    voiceBtn.classList.toggle('on', voiceEnabled);
  };
  voiceSel.addEventListener('change', e => {
    curVoice = e.target.value;
    localStorage.setItem(VOICE_KEY, curVoice);
  });
  refreshVoices();

  // --- 声音克隆：环境检测 / 一键安装 / 一键训练 ---
  const envList = document.getElementById('envList');
  const envBtn = document.getElementById('envBtn');
  const setupProgress = document.getElementById('setupProgress');
  const setupFill = document.getElementById('setupFill');
  const setupTxt = document.getElementById('setupTxt');
  const setupLog = document.getElementById('setupLog');
  const trainBox = document.getElementById('trainBox');
  const trainBtn = document.getElementById('trainBtn');
  const trainProgress = document.getElementById('trainProgress');
  const trainFill = document.getElementById('trainFill');
  const trainTxt = document.getElementById('trainTxt');
  const trainLog = document.getElementById('trainLog');
  let envTimer = null;

  function envItem(name, ok, msg) {
    const div = document.createElement('div');
    div.className = 'env-item ' + (ok ? 'ok' : 'bad');
    div.innerHTML = '<span class="env-dot"></span><span class="env-name"></span><span class="env-msg"></span>';
    div.querySelector('.env-name').textContent = name;
    div.querySelector('.env-msg').textContent = msg || (ok ? '正常' : '缺失');
    return div;
  }

  function refreshEnv() {
    fetch('/api/env').then(r => r.json()).then(d => {
      envList.innerHTML = '';
      envList.appendChild(envItem('Python 3.10+', d.python_ok, d.python));
      envList.appendChild(envItem('edge-tts', d.edge_tts, '微软语音引擎'));
      const torchMsg = d.torch ? (d.gpu ? d.gpu : 'CPU 版 ' + d.torch) : '未安装';
      envList.appendChild(envItem('PyTorch', !!d.torch, torchMsg));
      envList.appendChild(envItem('GPT-SoVITS 引擎', d.gsv, '训练核心'));
      envList.appendChild(envItem('ffmpeg', d.ffmpeg, '音频切片'));
      const wmsg = d.weights_ok ? '预训练模型齐备' : '缺 ' + d.weights_missing.length + ' 个';
      envList.appendChild(envItem('预训练模型', d.weights_ok, wmsg));
      if (d.models && d.models.length) {
        const m = document.createElement('div');
        m.className = 'env-item ok';
        m.innerHTML = '<span class="env-dot"></span><span class="env-name">已训练</span>';
        m.querySelector('.env-name').textContent = '已训练模型';
        const span = document.createElement('span');
        span.className = 'env-msg';
        span.textContent = d.models.join('、');
        m.appendChild(span);
        envList.appendChild(m);
      }
      trainBox.style.display = d.ready ? 'block' : 'none';
      envBtn.style.display = d.ready ? 'none' : 'block';
      envBtn.disabled = !!d.ready;
    }).catch(() => {});
  }

  const hermesEnvList = document.getElementById('hermesEnvList');
  const hermesDeployBtn = document.getElementById('hermesDeployBtn');
  const hermesProgress = document.getElementById('hermesProgress');
  const hermesTxt = document.getElementById('hermesTxt');
  const hermesLog = document.getElementById('hermesLog');
  let hermesTimer = null;

  function refreshHermes() {
    fetch('/api/hermes/status').then(r => r.json()).then(d => {
      hermesEnvList.innerHTML = '';
      if (d.installed) {
        hermesEnvList.appendChild(envItem('Hermes 内核', true, d.version || '已安装'));
        hermesEnvList.appendChild(envItem('路径', true, d.bin));
        hermesDeployBtn.style.display = 'none';
      } else {
        hermesEnvList.appendChild(envItem('Hermes 内核', false, '未安装'));
        hermesDeployBtn.style.display = 'block';
        hermesDeployBtn.textContent = '自动安装部署 Hermes（约 5~20 分钟）';
      }
    }).catch(() => {});
  }

  hermesDeployBtn.onclick = () => {
    hermesDeployBtn.disabled = true;
    hermesProgress.style.display = 'block';
    fetch('/api/hermes/deploy', { method: 'POST' }).then(r => r.json()).then(d => {
      if (!d.ok && d.error) {
        hermesTxt.textContent = d.error;
        hermesDeployBtn.disabled = false;
        return;
      }
      hermesTimer = setInterval(() => {
        fetch('/api/hermes/deploy/status').then(r => r.json()).then(s => {
          hermesTxt.textContent = s.phase || '';
          tailLog(hermesLog, s.log || []);
          if (!s.running) {
            clearInterval(hermesTimer);
            if (s.ok) {
              hermesTxt.textContent = 'Hermes 部署完成 ✓';
              refreshHermes();
            } else {
              hermesTxt.textContent = '部署失败：' + (s.error || '未知错误');
              hermesDeployBtn.disabled = false;
            }
          }
        }).catch(() => {});
      }, 1500);
    }).catch(() => { hermesDeployBtn.disabled = false; });
  };

  function tailLog(el, lines) {
    if (!el) return;
    el.textContent = lines.slice(-60).join('\n');
    el.scrollTop = el.scrollHeight;
  }

  // --- 语音输入：本地 STT 一键安装 ---
  const sttEnvList = document.getElementById('sttEnvList');
  const sttBtn = document.getElementById('sttBtn');
  const sttProgress = document.getElementById('sttProgress');
  const sttTxt = document.getElementById('sttTxt');
  const sttLog = document.getElementById('sttLog');
  let sttTimer = null;
  let sttInstalled = false;

  function refreshStt() {
    fetch('/api/stt/status').then(r => r.json()).then(d => {
      sttInstalled = !!d.installed;
      sttEnvList.innerHTML = '';
      if (d.installed) {
        sttEnvList.appendChild(envItem('本地语音识别', true, 'zipformer-zh 14M · sherpa-onnx ' + (d.engine_version || '')));
        sttBtn.style.display = 'none';
      } else {
        const msg = d.model ? '引擎缺失' : (d.engine ? '模型缺失' : '未安装');
        sttEnvList.appendChild(envItem('本地语音识别', false, msg));
        sttBtn.style.display = 'block';
      }
    }).catch(() => {});
  }

  sttBtn.onclick = () => {
    sttBtn.disabled = true;
    sttProgress.style.display = 'block';
    fetch('/api/stt/setup', { method: 'POST' }).then(r => r.json()).then(d => {
      if (!d.ok && d.error) { sttTxt.textContent = d.error; sttBtn.disabled = false; return; }
      sttTimer = setInterval(() => {
        fetch('/api/stt/status').then(r => r.json()).then(s => {
          sttTxt.textContent = s.phase || '';
          tailLog(sttLog, s.log || []);
          if (!s.running) {
            clearInterval(sttTimer);
            if (s.ok) {
              sttTxt.textContent = '语音识别安装完成 ✓';
              refreshStt();
            } else {
              sttTxt.textContent = '安装失败：' + (s.error || '未知错误');
              sttBtn.disabled = false;
            }
          }
        }).catch(() => {});
      }, 1500);
    }).catch(() => { sttBtn.disabled = false; });
  };

  // --- 语音输入：麦克风录音 → 识别 → 填入输入框 ---
  const micBtn = document.getElementById('micBtn');
  const msgInput = document.getElementById('msg');
  let mediaRec = null;
  let recChunks = [];
  let recStream = null;
  let recTimer = null;

  function stopRecording() {
    clearInterval(recTimer); recTimer = null;
    if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  }

  micBtn.onclick = () => {
    if (mediaRec && mediaRec.state === 'recording') { stopRecording(); return; }
    if (!sttInstalled) {
      alert('语音识别尚未安装，请在「设置 → 语音输入」里一键安装后使用');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('当前浏览器不支持麦克风录音');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      recStream = stream; recChunks = [];
      mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
      mediaRec.onstop = () => {
        micBtn.classList.remove('rec');
        stream.getTracks().forEach(t => t.stop());
        recStream = null;
        if (!recChunks.length) return;
        const blob = new Blob(recChunks, { type: mediaRec.mimeType || 'audio/webm' });
        recChunks = []; mediaRec = null;
        recognizeAudio(blob);
      };
      mediaRec.start();
      micBtn.classList.add('rec');
      micBtn.title = '停止录音';
      recTimer = setInterval(() => { if (mediaRec && mediaRec.state === 'recording') stopRecording(); }, 60000);
    }).catch(() => { alert('无法访问麦克风，请检查权限'); });
  };

  async function recognizeAudio(blob) {
    const origin = micBtn.innerHTML;
    micBtn.innerHTML = '<span style="font-size:11px">…</span>';
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const ab = await blob.arrayBuffer();
      const audio = await ac.decodeAudioData(ab);
      const src = audio.getChannelData(0);
      const ratio = audio.sampleRate / 16000;
      const n = Math.floor(src.length / ratio);
      const out = new Float32Array(n);
      for (let i = 0; i < n; i++) out[i] = src[Math.floor(i * ratio)];
      const wav = pcmToWav(out);
      const r = await fetch('/api/stt', { method: 'POST', body: wav });
      const d = await r.json();
      if (d.text) {
        msgInput.value = (msgInput.value ? msgInput.value + ' ' : '') + d.text;
        msgInput.focus();
      } else {
        alert('没有听清，请再说一次~');
      }
    } catch (e) {
      alert('语音识别失败：' + (e.message || e));
    } finally {
      micBtn.innerHTML = origin;
      micBtn.title = '语音输入（本地识别，点击录音）';
    }
  }

  function pcmToWav(samples) {
    const n = samples.length;
    const buf = new ArrayBuffer(44 + n * 2);
    const dv = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    let o = 0;
    ws(o, 'RIFF'); dv.setUint32(o + 4, 36 + n * 2, true); ws(o + 8, 'WAVE'); o += 12;
    ws(o, 'fmt '); dv.setUint32(o + 4, 16, true); dv.setUint16(o + 8, 1, true);
    dv.setUint16(o + 10, 1, true); dv.setUint32(o + 12, 16000, true);
    dv.setUint32(o + 16, 32000, true); dv.setUint16(o + 20, 2, true); dv.setUint16(o + 22, 16, true); o += 24;
    ws(o, 'data'); dv.setUint32(o + 4, n * 2, true); o += 8;
    for (let i = 0; i < n; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2;
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  envBtn.onclick = () => {
    envBtn.disabled = true;
    setupProgress.style.display = 'block';
    fetch('/api/setup', { method: 'POST' }).then(() => {
      envTimer = setInterval(() => {
        fetch('/api/setup/status').then(r => r.json()).then(s => {
          setupTxt.textContent = s.phase + ' · ' + Math.round(s.progress || 0) + '%';
          setupFill.style.width = (s.progress || 0) + '%';
          tailLog(setupLog, s.log || []);
          if (!s.running) {
            clearInterval(envTimer);
            if (s.ok) {
              setupTxt.textContent = '环境安装完成 ✓';
              setupFill.style.width = '100%';
              refreshEnv();
              refreshVoices();
            } else {
              setupTxt.textContent = '安装失败：' + (s.error || '未知错误');
              envBtn.disabled = false;
            }
          }
        }).catch(() => {});
      }, 1200);
    }).catch(() => { envBtn.disabled = false; });
  };

  function trainStagePct(log) {
    const map = [
      ['切片', 12], ['ASR', 24], ['转写', 24], ['预处理', 38],
      ['s2', 78], ['s1', 95], ['部署', 100], ['完成', 100],
    ];
    let pct = 4, hit = null;
    (log || []).forEach(line => {
      map.forEach(([kw, v]) => { if (line.includes(kw)) { hit = kw; pct = v; } });
    });
    if (hit) return pct;
    return pct;
  }

  trainBtn.onclick = () => {
    const name = document.getElementById('trainName').value.trim();
    const file = document.getElementById('trainAudio').files[0];
    if (!name) { alert('请填写声音名称'); return; }
    if (!file) { alert('请选择录音文件'); return; }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('audio', file);
    fd.append('s1_epochs', document.getElementById('trainS1').value || '20');
    fd.append('s2_epochs', document.getElementById('trainS2').value || '60');
    trainBtn.disabled = true;
    trainProgress.style.display = 'block';
    trainTxt.textContent = '提交中…';
    fetch('/api/train', { method: 'POST', body: fd }).then(r => r.json()).then(d => {
      if (!d.ok) { trainTxt.textContent = '启动失败：' + (d.error || ''); trainBtn.disabled = false; return; }
      const timer = setInterval(() => {
        fetch('/api/train/status').then(r => r.json()).then(s => {
          const pct = s.progress || trainStagePct(s.log);
          trainTxt.textContent = (s.stage || '训练中') + ' · ' + Math.round(pct) + '%';
          trainFill.style.width = pct + '%';
          tailLog(trainLog, s.log || []);
          if (!s.running) {
            clearInterval(timer);
            trainBtn.disabled = false;
            if (s.ok) {
              trainTxt.textContent = '训练完成 ✓ 已在音色列表注册「' + s.name + '·克隆」';
              trainFill.style.width = '100%';
              document.getElementById('trainName').value = '';
              document.getElementById('trainAudio').value = '';
              refreshVoices();
              refreshEnv();
              voiceSel.value = 'clone:' + s.name;
              curVoice = voiceSel.value;
              localStorage.setItem(VOICE_KEY, curVoice);
            } else {
              trainTxt.textContent = '训练失败：' + (s.error || '见日志');
            }
          }
        }).catch(() => {});
      }, 2000);
    }).catch(() => { trainTxt.textContent = '启动失败'; trainBtn.disabled = false; });
  };
  voiceBtn.classList.toggle('on', voiceEnabled);

  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
