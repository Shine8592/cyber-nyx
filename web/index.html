<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Cyber Nyx · 夜之女神赛博助手</title>
<style>
  :root {
    --bg0: #0b1026; --bg1: #151a3a; --gold: #c9a35c; --violet: #7c6ff0;
    --text: #eef1ff; --dim: #9aa3d0; --card: rgba(255,255,255,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background: radial-gradient(1200px 700px at 80% -10%, #2a2160 0%, var(--bg0) 55%), var(--bg0);
    color: var(--text); height:100vh; overflow:hidden;
  }
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.7; animation: twinkle 3s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.9} }

  .app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; max-width:880px; margin:0 auto; padding:18px 20px 0; }

  header { display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.08); }
  .moon { width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff4d6, var(--gold)); box-shadow:0 0 24px rgba(201,163,92,.7); }
  .brand h1 { font-size:20px; font-weight:600; letter-spacing:1px; }
  .brand p { font-size:12px; color:var(--dim); margin-top:2px; }
  .status { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#5cd47c; box-shadow:0 0 8px #5cd47c; }

  .avatar-zone { display:flex; justify-content:center; padding:34px 0 18px; }
  .avatar {
    width:150px; height:150px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3d3278, #171b3e);
    border:2px solid rgba(201,163,92,.55);
    box-shadow: 0 0 60px rgba(124,111,240,.35), inset 0 0 40px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    font-size:64px; transition: transform .3s ease;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-8px) } }
  .avatar.happy { transform: scale(1.05) rotate(2deg); }
  .avatar.sad { filter: saturate(.6) brightness(.85); }
  .avatar.curious { transform: rotate(-4deg) scale(1.03); }
  .avatar.angry { transform: scale(.98) rotate(-3deg); filter: hue-rotate(-20deg) saturate(1.3); }
  .avatar.surprised { transform: scale(1.1); animation: none; }
  .avatar.shy { transform: translateY(4px) scale(.98); filter: brightness(1.08); }

  .chat { flex:1; overflow-y:auto; padding:6px 4px 12px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:76%; padding:11px 15px; border-radius:16px; font-size:15px; line-height:1.55; animation: rise .25s ease; }
  @keyframes rise { from{ opacity:0; transform: translateY(6px) } to{ opacity:1; transform:none } }
  .nyx { align-self:flex-start; background:var(--card); border:1px solid rgba(201,163,92,.22); border-bottom-left-radius:4px; }
  .me { align-self:flex-end; background:linear-gradient(135deg,#2a2f66,#3b3277); border:1px solid rgba(124,111,240,.35); border-bottom-right-radius:4px; }
  .typing { color:var(--dim); font-size:14px; align-self:flex-start; padding:6px 4px; }
  .typing-cursor {
    display:inline-block; width:2px; height:1em; background:var(--gold);
    margin-left:2px; vertical-align:-2px; animation: blink .8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .new-chat {
    background:transparent; border:1px solid rgba(255,255,255,.14); color:var(--dim);
    border-radius:10px; padding:7px 12px; font-size:12px; cursor:pointer; transition: all .2s;
  }
  .new-chat:hover { color:var(--text); border-color:var(--gold); background:rgba(201,163,92,.1); }

  .input-bar { display:flex; gap:10px; padding:14px 0 20px; }
  .input-bar input {
    flex:1; background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:12px;
    padding:13px 16px; color:var(--text); font-size:15px; outline:none; transition:border .2s;
  }
  .input-bar input:focus { border-color: var(--gold); }
  .input-bar button {
    background: linear-gradient(135deg, var(--gold), #a8844a); border:none; border-radius:12px;
    color:#1a1408; font-weight:700; padding:0 24px; font-size:15px; cursor:pointer; transition: opacity .2s;
  }
  .input-bar button:hover { opacity:.85; }
  .input-bar select {
    background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:12px;
    padding:13px 10px; color:var(--text); font-size:14px; outline:none; cursor:pointer;
  }
  .input-bar select option { background:#151a3a; color:var(--text); }
  .foot { text-align:center; color:var(--dim); font-size:11px; padding-bottom:10px; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="app">
  <header>
    <div class="moon"></div>
    <div class="brand">
      <h1>🌙 Cyber Nyx · 小夜</h1>
      <p>夜之女神 · 赛博助手 · Hermes 内核</p>
    </div>
    <div class="status"><span class="dot"></span><span id="mode">连接中</span></div>
    <button class="new-chat" id="newChat" title="开启新对话">新对话</button>
  </header>

  <div class="avatar-zone">
    <div class="avatar" id="avatar">🌙</div>
  </div>

  <div class="chat" id="chat">
    <div class="bubble nyx">夜安，主人。今晚想让我陪你做什么呢~</div>
  </div>

  <div class="input-bar">
    <input id="msg" placeholder="跟小夜说点什么…（也可以让它帮你做事）" autocomplete="off">
    <select id="fmt">
      <option value="text">文本</option>
      <option value="json">JSON</option>
      <option value="sse">流式</option>
    </select>
    <button id="send">发送</button>
  </div>
  <div class="foot">Cyber Nyx v0.5 · Powered by Hermes Agent + universal-agent-memory</div>
</div>

<script>
  const stars = document.getElementById('stars');
  for (let i=0;i<90;i++) {
    const s = document.createElement('div');
    s.className='star';
    const sz = Math.random()*2.4 + 0.6;
    s.style.width = s.style.height = sz + 'px';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*3 + 's';
    stars.appendChild(s);
  }

  const chat = document.getElementById('chat');
  const avatar = document.getElementById('avatar');
  const input = document.getElementById('msg');
  const modeEl = document.getElementById('mode');

  fetch('/api/status').then(r=>r.json()).then(d => {
    if (d.core === 'hermes') modeEl.textContent = 'Hermes 内核·记忆在线';
    else modeEl.textContent = '本地演示';
  }).catch(()=>{});

  // --- 会话管理：localStorage 持久化 session_id ---
  const SESSION_KEY = 'cyber_nyx_session_id';
  let sessionId = localStorage.getItem(SESSION_KEY) || '';

  async function ensureSession() {
    // 没有 session_id 时向服务端申请一个
    if (sessionId) return sessionId;
    try {
      const resp = await fetch('/api/session/new');
      const d = await resp.json();
      sessionId = d.session_id;
      localStorage.setItem(SESSION_KEY, sessionId);
    } catch (e) {
      sessionId = 'default';
    }
    return sessionId;
  }

  async function resetSession() {
    // 新对话：删除旧会话，重新申请 session_id
    if (sessionId) {
      try { await fetch('/api/session/' + sessionId, { method: 'DELETE' }); } catch (e) {}
    }
    sessionId = '';
    localStorage.removeItem(SESSION_KEY);
    chat.innerHTML = '';
    addBubble('主人，我们重新开始吧~ 今晚想聊些什么呢？', 'nyx');
    await ensureSession();
  }

  document.getElementById('newChat').onclick = () => {
    if (chat.querySelectorAll('.bubble').length > 1 && !confirm('开启新对话会清空当前聊天记录，确定吗？')) return;
    resetSession();
  };

  // --- 主动关心轮询（使用当前 session_id） ---
  async function checkProactiveCare() {
    if (!sessionId) await ensureSession();
    try {
      const resp = await fetch('/api/care?session_id=' + encodeURIComponent(sessionId));
      const data = await resp.json();
      if (data.care && data.message) {
        addBubble(data.message, 'nyx');
      }
    } catch (e) { /* 静默 */ }
  }
  // 页面加载 3 秒后首次检查（首次问候），之后每 5 分钟轮询
  setTimeout(() => {
    checkProactiveCare();
    setInterval(checkProactiveCare, 5 * 60 * 1000);
  }, 3000);

  function addBubble(text, who) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  // --- 打字机效果：逐字显示 Nyx 回复 ---
  const TYPE_SPEED = 28; // 每字符间隔 ms

  function typeBubble(text, who, done) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    b.appendChild(cursor);
    chat.appendChild(b);

    let i = 0;
    function step() {
      if (i < text.length) {
        // 成块插入（中文按 1-3 字符，避免逐字闪烁过快）
        const n = /[\x00-\x7f]/.test(text[i]) ? 1 : 2;
        b.insertBefore(document.createTextNode(text.slice(i, i + n)), cursor);
        i += n;
        chat.scrollTop = chat.scrollHeight;
        setTimeout(step, TYPE_SPEED);
      } else {
        cursor.remove();
        if (done) done(b);
      }
    }
    step();
    return b;
  }

  function setEmotion(e) {
    avatar.className = 'avatar';
    if (e && e !== 'neutral') avatar.classList.add(e);
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg) return;
    addBubble(msg, 'me');
    input.value = '';
    await ensureSession();
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = '小夜正在思索…';
    chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

    const fmt = document.getElementById('fmt').value;
    const url = fmt === 'sse' ? '/api/chat/stream' : '/api/chat';
    const opts = {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, format: fmt, session_id: sessionId}),
    };

    try {
      if (fmt === 'sse') {
        const resp = await fetch(url, opts);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = '';
        let finished = false;
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) {
              const d = JSON.parse(line.slice(6));
              if (d.chunk) {
                fullReply += d.chunk;
                typing.textContent = fullReply + '…';
                chat.scrollTop = chat.scrollHeight;
              }
              if (d.done) {
                finished = true;
                if (d.session_id) {
                  sessionId = d.session_id;
                  localStorage.setItem(SESSION_KEY, sessionId);
                }
                typing.remove();
                setEmotion(d.emotion);
                // 收到完整回复后用打字机效果展示
                setTimeout(() => typeBubble(d.reply || fullReply, 'nyx'), 250);
                return;
              }
            }
          }
        }
        if (!finished) {
          typing.remove();
          typeBubble(fullReply || '嗯？主人没有说话呢~', 'nyx');
        }
      } else {
        const r = await fetch(url, opts);
        const d = await r.json();
        if (d.session_id) {
          sessionId = d.session_id;
          localStorage.setItem(SESSION_KEY, sessionId);
        }
        typing.remove();
        setEmotion(d.emotion);
        setTimeout(() => typeBubble(d.reply, 'nyx'), 250);
      }
    } catch(e) {
      typing.remove();
      addBubble('唔，网络有些不乖呢，主人稍后再试好不好~', 'nyx');
    }
  }

  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
