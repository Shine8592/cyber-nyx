[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "PIE", "PLW", "UP", "I", "BLE"]

# These are intentional in this project:
# - BLE001: catching Exception is intentional for graceful degradation in production
# - EXE001: shebangs are intentional on script files
# - PLW1510: subprocess.run without check= is intentional for shell commands
# - S110: try-except-pass is intentional for non-critical operations
# - PIE810: endswith with tuple is a minor style preference
# - S104: binding to all interfaces is intentional for a local server
# - S310/S311/S324/S603/S607: subprocess and hashlib usage is intentional
# - B017/B904: exception handling patterns are intentional
# - PLW2901: loop variable overwrite is intentional in MCP connection
ignore = ["BLE001", "EXE001", "PLW1510", "S110", "PIE810", "S104", "S310", "S311", "S324", "S603", "S607", "B017", "B904", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001"]
"**/conftest.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true